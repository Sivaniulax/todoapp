# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: todoapp-db
    plan: free
    databaseName: todoapp_production
    user: todoapp

services:
  - type: web
    name: todoapp-api
    runtime: ruby
    plan: free
    rootDir: backend
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: todoapp-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: FRONTEND_ORIGINS # your Vercel URL, e.g. https://todoapp.vercel.app
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Solid Queue runs inside Puma on this one service. Set to "false" and
      # add a worker service if jobs ever outgrow the web dyno.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      # Mail is skipped entirely unless MAIL_SMTP_ADDRESS is set.
      - key: APP_HOST
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_ADDRESS
        sync: false
      - key: MAIL_SMTP_PORT
        sync: false
      - key: MAIL_SMTP_USERNAME
        sync: false
      - key: MAIL_SMTP_PASSWORD
        sync: false
